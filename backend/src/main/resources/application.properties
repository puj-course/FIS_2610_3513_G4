spring.application.name=fashtoll

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/fashtoll_db
spring.datasource.username=${DB_USERNAME_SECRET}
spring.datasource.password=${DB_PASSWORD_SECRET}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Cambiar ddl-auto a validate cuando esté preparado Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
# Descomentar cuando esté listo
# spring.flyway.enabled=true
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

## Unable automatic Docker Compose of Spring
spring.docker.compose.enabled=false

# JWT
security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-time=86400000

# Spring Boot Actuator
# Exponer los endpoints de métricas y salud a través de la API Web (HTTP)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Mostrar detalles completos del estado de salud de la aplicación
management.endpoint.health.show-details=always
# Habilitar métricas de JVM, Tomcat y base de datos por defecto
management.metrics.export.defaults.enabled=true

# Twilio SMS
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.from-number=${TWILIO_FROM_NUMBER}
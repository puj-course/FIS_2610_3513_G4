spring.application.name=fashtoll

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/fashtoll_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Cambiar ddl-auto a validate cuando esté preparado Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
# Descomentar cuando esté listo
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

## Unable automatic Docker Compose of Spring
spring.docker.compose.enabled=false


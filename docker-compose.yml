services:

  # ────────────────────────────────────────────────────────────────────────────
  # BASE DE DATOS — PostgreSQL 15
  # ────────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: fashtoll-db
    environment:
      POSTGRES_DB: fashtoll_db
      POSTGRES_USER: ${DB_USERNAME_SECRET}
      POSTGRES_PASSWORD: ${DB_PASSWORD_SECRET}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fashtoll-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME_SECRET} -d fashtoll_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped


  # ────────────────────────────────────────────────────────────────────────────
  # BACKEND — Spring Boot 4 (Java 21)
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nicojoya/fashtoll-backend:latest
    container_name: fashtoll-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fashtoll_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME_SECRET}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fashtoll-net
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────────────
  # FRONTEND — React + Vite servido por Nginx
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    image: nicojoya/fashtoll-frontend:latest
    container_name: fashtoll-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fashtoll-net
    restart: unless-stopped

# ──────────────────────────────────────────────────────────────────────────────
# RED COMPARTIDA
# ──────────────────────────────────────────────────────────────────────────────
networks:
  fashtoll-net:
    driver: bridge

# ──────────────────────────────────────────────────────────────────────────────
# VOLÚMENES PERSISTENTES
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:

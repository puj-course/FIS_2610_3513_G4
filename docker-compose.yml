services:

  # ────────────────────────────────────────────────────────────────────────────
  # BASE DE DATOS — PostgreSQL 15
  # ────────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: fashtoll-db
    environment:
      POSTGRES_DB: fashtoll_db
      POSTGRES_USER: ${DB_USERNAME_SECRET}
      POSTGRES_PASSWORD: ${DB_PASSWORD_SECRET}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fashtoll-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME_SECRET} -d fashtoll_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────────────
  # MOTOR DE BÚSQUEDA — Elasticsearch 9.0.0
  # ────────────────────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: fashtoll-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - fashtoll-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────────────
  # BACKEND — Spring Boot 4 (Java 21)
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nicojoya/fashtoll-backend:latest
    container_name: fashtoll-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fashtoll_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME_SECRET}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_SECRET}
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - fashtoll-net
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────────────
  # FRONTEND — React + Vite servido por Nginx
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    image: nicojoya/fashtoll-frontend:latest
    container_name: fashtoll-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fashtoll-net
    restart: unless-stopped

# ──────────────────────────────────────────────────────────────────────────────
# RED COMPARTIDA
# ──────────────────────────────────────────────────────────────────────────────
networks:
  fashtoll-net:
    driver: bridge

# ──────────────────────────────────────────────────────────────────────────────
# VOLÚMENES PERSISTENTES
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  elasticsearch_data:

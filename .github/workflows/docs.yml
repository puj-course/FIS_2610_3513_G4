name: API Documentation

on:
  push:
    paths:
      - 'backend/src/**'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fashtoll_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          node.store.allow_mmap: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Backend
        working-directory: backend
        run: ./mvnw package -DskipTests

      - name: Run Backend and Extract OpenAPI JSON
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fashtoll_db
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200
        run: |
          # Ejecutar en segundo plano
          java -jar backend/target/*.jar &
          
          # Esperar a que el endpoint esté disponible
          echo "Esperando a que la API esté lista..."
          MAX_RETRIES=30
          COUNT=0
          while ! curl -s http://localhost:8080/v3/api-docs > /dev/null; do
            sleep 5
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Error: Tiempo de espera agotado para la API"
              exit 1
            fi
          done
          
          # Descargar JSON
          curl http://localhost:8080/v3/api-docs -o docs/api/api-docs.json
          echo "OpenAPI JSON extraído correctamente."

      - name: Convert OpenAPI to Markdown
        run: |
          # Usar swagger-markdown para convertir a MD
          npx swagger-markdown -i docs/api/api-docs.json -o docs/api/API.md
          echo "Markdown generado en docs/api/API.md"

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update api documentation [skip ci]"
          file_pattern: 'docs/api/*'

name: Continuous Deployment
run-name: "${{ github.actor }} triggered CD — ${{ github.event_name }}"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]

jobs:
  build-and-push:
    name: Build & Push Docker Images — Fashtoll
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ── 2. Versionado automático ───────────────────────────────────────────
      # Si el trigger es un release publicado se usa su tag (v1.2.3).
      # En cualquier otro caso se usa el SHA corto del commit (sha-a1b2c3d).
      - name: Determinar versión de imagen
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      # ── 3. Build del Backend (Maven) ───────────────────────────────────────
      - name: Configurar JDK 21 con caché Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos de ejecución al Maven Wrapper
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Compilar JAR con Maven (sin tests)
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests --no-transfer-progress

      # ── 4. Build del Frontend (Node / Vite) ────────────────────────────────
      - name: Configurar Node.js 20 con caché npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm ci --prefer-offline

      - name: Build del frontend (TypeScript + Vite)
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

      # ── 5. Configuración de Docker ─────────────────────────────────────────
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 6. Imagen del Backend ──────────────────────────────────────────────
      # Se publica siempre el tag versionado + 'latest'.
      # En pull_request el push se omite (push: false) para validar el build
      # sin publicar imágenes de ramas de trabajo.
      - name: Build y Push — fashtoll-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fashtoll-backend:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fashtoll-backend:latest
          cache-from: type=gha,scope=fashtoll-backend
          cache-to: type=gha,mode=max,scope=fashtoll-backend

      # ── 7. Imagen del Frontend ─────────────────────────────────────────────
      - name: Build y Push — fashtoll-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fashtoll-frontend:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fashtoll-frontend:latest
          build-args: |
            VITE_API_URL=http://localhost:8080
          cache-from: type=gha,scope=fashtoll-frontend
          cache-to: type=gha,mode=max,scope=fashtoll-frontend

      # ── 8. Resumen del workflow ────────────────────────────────────────────
      - name: Publicar resumen del despliegue
        if: github.event_name != 'pull_request'
        run: |
          echo "## 🐳 Imágenes Docker publicadas en Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ secrets.DOCKERHUB_USERNAME }}/fashtoll-backend\` | \`${{ steps.version.outputs.tag }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ secrets.DOCKERHUB_USERNAME }}/fashtoll-frontend\` | \`${{ steps.version.outputs.tag }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Comandos para ejecutar el stack completo" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker compose pull && docker compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
